name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel in-progress runs on the same branch/PR when a newer commit lands —
# the self-hosted runner pool is small, no point burning cycles on stale shas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single sequential job rather than four parallel ones: the builder is a
  # tiny one-binary crate, all three cargo invocations reuse the same
  # `target/` directory, and the runner is one box anyway. `nix build
  # .#builder` then exercises the packaging that ships skopeo+umoci on
  # the wrapped binary's PATH — we regressed that wrap once already
  # (postInstall makeWrapper) and the whole point of this workflow is to
  # catch that before it lands on master again.
  check:
    name: build / clippy / test / nix / rootfs size
    runs-on: [self-hosted, nix]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Warm the dev shell so the toolchain (rustc, cargo, clippy, skopeo,
      # umoci) is fully resolved before any cargo invocation. On a warm
      # /nix/store this is near-instant; on a cold one it does the heavy
      # download once instead of in the middle of a build step.
      - name: Warm dev shell
        run: nix develop --command true

      - name: cargo build
        run: nix develop --command cargo build --locked

      - name: cargo clippy --all-targets -- -D warnings
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test --locked

      # Build the Nix-packaged binary so the skopeo+umoci wrap (postInstall
      # makeWrapper in flake.nix) keeps working. `BUILDER_PATH=result/bin/builder
      # enclavia reproduce <id>` trips on `skopeo: No such file or directory`
      # the moment that wrap drops — we don't want to find out from a user.
      - name: nix build .#builder
        run: nix build .#builder

      # Exercise the archive-to-cpio boundary with synthetic non-root
      # ownership, setuid mode bits, hardlinks, symlinks, and a device node.
      - name: Check OCI metadata archive conversion
        run: nix build .#checks.x86_64-linux.oci-metadata --print-build-logs

      # Prove deny-all EIFs omit the complete in-enclave egress stack while
      # egress-enabled EIFs still contain every required binary and config.
      - name: Check egress feature gate
        run: nix build .#checks.x86_64-linux.egress-feature-gate --print-build-logs

      # Build only the uncompressed rootfs trees, not their kernels or EIFs.
      # Each check emits a stable per-path manifest and fails if the
      # builder-owned base/storage overhead exceeds its byte budget.
      - name: Check uncompressed rootfs size budgets
        run: |
          check_rootfs_size() {
            variant="$1"
            result_link="result-rootfs-size-$variant"

            nix build \
              ".#checks.x86_64-linux.rootfs-size-$variant" \
              --out-link "$result_link" \
              --print-build-logs

            echo "::group::$variant rootfs size manifest"
            cat "$result_link/rootfs-size-summary.tsv"
            cat "$result_link/rootfs-size-manifest.tsv"
            echo "::endgroup::"

            {
              echo "### $variant rootfs size"
              echo '```tsv'
              cat "$result_link/rootfs-size-summary.tsv"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          check_rootfs_size base
          check_rootfs_size storage

      # Resolve both allnoconfig policies (including forbidden-option/count
      # assertions), compile both kernels, and assemble representative EIFs.
      # Runtime boot/I/O coverage remains in the enclavia-crates QEMU e2e
      # harnesses documented in docs/kernel.md.
      - name: build base and storage EIF profiles
        run: >-
          nix build --no-link
          .#enclave-kernel-config
          .#enclave-storage-kernel-config
          .#test-enclave
          .#test-enclave-storage

      - name: record kernel and EIF sizes
        run: |
          nix build .#kernel-size-report -o result-kernel-size-report
          {
            echo '### Enclave kernel size report'
            echo '```text'
            cat result-kernel-size-report/report
            cat result-kernel-size-report/base-config-report
            cat result-kernel-size-report/storage-config-report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
